name: Test validator
on:
  push:
    paths: ['validate-og.cjs', 'test/**', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run.cjs
