name: OG Monitor (all sites)
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lucab85/site-og-check
          ref: main
      - name: Check all sites
        id: check
        run: |
          urls=(
            "https://lucaberton.com/"
            "https://ansiblepilot.com/"
            "https://ansiblebyexample.com/"
            "https://terraformpilot.com/"
            "https://copypastelearn.com/"
            "https://trymanna.ai/"
            "https://heavenartshop.com/"
            "https://openempower.com/"
            "https://sferapay.com/"
            "https://kubernetes.recipes/"
            "https://www.udienza.com/"
          )
          fail=0
          report=""
          for u in "${urls[@]}"; do
            out=$(node validate-og.cjs --url "$u" 2>&1)
            echo "$out"
            if echo "$out" | grep -q "❌ FAIL"; then
              fail=$((fail+1))
              report="${report}
          ## $u
          ${out}"
            fi
          done
          {
            echo "fail_count=$fail"
            echo "report<<EOF"
            echo "$report"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Open / update issue on failure
        if: ${{ steps.check.outputs.fail_count != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fail = '${{ steps.check.outputs.fail_count }}';
            const body = `OG/social-card check found ${fail} failing site(s):
            ${{ steps.check.outputs.report }}
            \n_Automated by site-og-check monitor._`;
            const repos = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open',
              labels: ['og-monitor']
            });
            const existing = repos.data.find(i => i.title === 'OG check failing');
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'OG check failing', body, labels: ['og-monitor'] });
            }
